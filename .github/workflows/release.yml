name: Distribution checksums
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skills/neckbeard/requirements.txt
      - run: python skills/neckbeard/scripts/checksums.py verify
      - run: python -m unittest discover -s tests -v
      - name: Package reviewed source
        run: |
          mkdir -p /tmp/distribution
          git archive --format=zip --prefix=neckbeard/ HEAD > /tmp/distribution/neckbeard.zip
          cd /tmp/distribution
          sha256sum neckbeard.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: neckbeard-distribution
          path: /tmp/distribution
